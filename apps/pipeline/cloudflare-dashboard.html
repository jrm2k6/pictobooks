<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pictobook · Cloudflare Review</title>
    <style>
      :root {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #23342e;
        background: #f3f5f1;
        font-synthesis: none;
        font-optical-sizing: auto;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 1100px;
      }
      button,
      select,
      textarea {
        font: inherit;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 238px 1fr;
      }
      .rail {
        background: #203a31;
        color: #eef4ef;
        padding: 25px 18px;
        display: flex;
        flex-direction: column;
        gap: 38px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 760;
        letter-spacing: -0.4px;
        font-size: 17px;
      }
      .brandmark {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: #e98c6a;
        display: grid;
        place-items: center;
        color: white;
        font-family: Georgia;
        font-size: 21px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav a {
        color: #c7d4cc;
        text-decoration: none;
        padding: 12px;
        border-radius: 10px;
        font-size: 14px;
      }
      .nav a.active {
        background: #315347;
        color: #fff;
      }
      .rail-note {
        margin-top: auto;
        color: #b4c5bb;
        font-size: 12px;
        line-height: 1.5;
        padding: 0 10px;
      }
      .main {
        min-width: 0;
      }
      .topbar {
        height: 76px;
        border-bottom: 1px solid #e1e7e1;
        background: #fbfcfa;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 42px;
      }
      .crumb {
        font-size: 13px;
        color: #718078;
      }
      .avatar {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #4b5e54;
        font-size: 13px;
      }
      .avatar b {
        width: 34px;
        height: 34px;
        background: #e9eee9;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #426456;
      }
      .content {
        max-width: 1480px;
        margin: auto;
        padding: 36px 42px 56px;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 28px;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 1.4px;
        color: #819087;
        font-size: 11px;
        font-weight: 760;
      }
      .heading h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: 34px;
        letter-spacing: -0.8px;
        margin: 7px 0 0;
        color: #203a31;
      }
      .sub {
        font-size: 14px;
        color: #77867e;
        margin-top: 8px;
      }
      .btn {
        border: 0;
        border-radius: 8px;
        padding: 11px 15px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.primary {
        background: #dd7958;
        color: white;
      }
      .btn.soft {
        background: #e8eee9;
        color: #315346;
      }
      .btn.line {
        background: white;
        border: 1px solid #d9e1da;
        color: #405b4e;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .panel {
        background: #fff;
        border: 1px solid #e1e7e1;
        border-radius: 14px;
        box-shadow: 0 3px 12px #253b3010;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 20px;
        border-bottom: 1px solid #e8ece8;
      }
      .toolbar h2 {
        font-size: 14px;
        margin: 0;
      }
      .toolbar small {
        color: #829087;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
      }
      .table th {
        text-align: left;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #849189;
        font-weight: 750;
        padding: 13px 20px;
      }
      .table td {
        padding: 16px 20px;
        border-top: 1px solid #edf0ed;
        font-size: 13px;
      }
      .table tr[data-click] {
        cursor: pointer;
      }
      .table tr[data-click]:hover {
        background: #f8faf8;
      }
      .book-title {
        font-weight: 720;
        color: #2c4036;
      }
      .muted {
        color: #839087;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 30px;
        padding: 6px 9px;
        font-size: 10px;
        font-weight: 760;
        white-space: nowrap;
      }
      .pill.green {

        background: #e5f2e9;
      }
      .pill.amber {
        color: #8a621b;
        background: #fbf0d8;
      }
      .pill.red {
        color: #9e4742;
        background: #fae9e6;
      }
      .pill.gray {
        color: #68756d;

      }
      .pill.blue {
        color: #335c7a;
        background: #e7f0f5;

      .dot {

        height: 6px;
        background: currentColor;

      }

        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 20px 0;
      }

      }

        display: block;
        color: #839087;
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;

      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin: 28px 0 13px;
      }
      .section-head h2 {
        font-size: 17px;
        margin: 0;

      }
      .pages {
        display: grid;
        gap: 14px;

      .page-card {

        width: 96px;

        background: #f3e9dc;

      .page-meta {
        font-size: 12px;

        margin-top: 7px;

      .chips {

      .actions {
        display: flex;
        gap: 8px;

        display: grid;
        grid-template-columns: minmax(430px, 1.15fr) minmax(370px, 0.85fr);

        align-items: start;
      }

      .preview-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;

      .preview-image {

        height: 590px;
        object-fit: contain;
        background: #f8f8f5;
        border: 1px solid #eaeeea;
        border-radius: 9px;
      }
      .candidate-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 0;
        border-bottom: 1px solid #edf0ed;
      }
      .candidate-thumb {
        width: 48px;
        height: 55px;
        object-fit: cover;
        background: #f5eee4;
        border-radius: 6px;
      }
      .candidate-title {
        font-size: 13px;
        font-weight: 700;
      }
      .candidate-details {
        font-size: 11px;
        color: #819087;
        margin-top: 5px;
      }
      .qa-box {
        padding: 15px;
        background: #f6f8f6;
        border-radius: 10px;
        margin-top: 11px;
      }
      .qa-title {
        display: flex;
        justify-content: space-between;
        font-weight: 730;
        font-size: 13px;
      }
      .qa-copy {
        font-size: 12px;
        color: #65756b;
        line-height: 1.5;
        margin-top: 8px;
      }
      .review-form {
        padding: 19px;
        margin-top: 16px;
      }
      .review-form h3 {
        font-size: 15px;
        margin: 0 0 13px;
      }
      .field {
        display: grid;
        gap: 7px;
        margin: 12px 0;
      }
      .field label {
        font-size: 11px;
        font-weight: 740;
        color: #65756c;
      }
      .field textarea,
      .field select {
        border: 1px solid #dbe3dc;
        border-radius: 8px;

        color: #2c4036;

      }
      .form-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 15px;
      }
      .empty,

        text-align: center;
        color: #728078;
      }
      .empty strong {
        display: block;
        color: #385546;
        margin-bottom: 7px;
      }
      .toast {
        position: fixed;
        right: 26px;
        bottom: 24px;
        padding: 14px 18px;
        background: #203a31;
        color: white;
        border-radius: 10px;
        box-shadow: 0 8px 30px #12251c30;
        font-size: 13px;
        z-index: 5;
      }
      .back {
        border: 0;
        background: none;
        color: #60746a;
        cursor: pointer;
        font-size: 13px;
        padding: 0;
        margin-bottom: 17px;
      }
      .detail-title {
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      .detail-title h1 {
        font-family: Georgia, serif;
        font-size: 31px;
        font-weight: 500;
        margin: 6px 0;
      }
      .banner {
        padding: 14px 17px;
        border-radius: 10px;
        background: #f7efdf;
        color: #725923;
        font-size: 13px;
        line-height: 1.5;
        margin: 15px 0;
      }
      .canonical {
        margin-top: 18px;
        padding: 17px 19px;
      }
      .canonical h3 {
        font-size: 14px;
        margin: 0;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #13241dbb;
        display: grid;
        place-items: center;
        z-index: 10;
      }
      .modal {
        width: 480px;
        background: #fff;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 18px 60px #1118;
      }
      .modal h2 {
        font-family: Georgia, serif;
        font-weight: 500;
        font-size: 25px;
        margin: 0 0 9px;
      }
      .modal p {
        font-size: 13px;
        color: #6d7b72;
        line-height: 1.5;
      }
      .modal-actions {
        display: flex;
        justify-content: end;
        gap: 9px;
        margin-top: 22px;
      }
      .hide {

      .story-tag {
        font-size: 10px;
        background: #edf1ee;
        border-radius: 20px;
        padding: 6px 9px;
        color: #67776e;
      }
      .source-strip {
        display: flex;
        align-items: center;
        gap: 11px;
        background: #f5f7f4;
        border: 1px solid #e8ece8;
        border-radius: 9px;
        padding: 9px 11px;
        margin: 0 0 14px;

      .source-strip img {
        width: 44px;
        height: 54px;
        object-fit: cover;
        border-radius: 5px;
        background: #eee;
      }
      .source-strip strong {

      }
      .source-strip small {
        display: block;
        color: #78867d;
        margin-top: 4px;
        font-size: 10px;
      }
      .source-strip button {
        margin-left: auto;
        border: 0;
        background: none;
        color: #587163;

      }
      .brief-box {
        display: none;
        background: #f9f8f2;
        padding: 10px;
        border-radius: 7px;
        margin: 0 0 12px;
        white-space: pre-wrap;
        color: #536459;
        font:
          11px/1.5 ui-monospace,
          monospace;
      }
      #modal .modal-actions {
        display: flex !important;
        visibility: visible !important;
        opacity: 1 !important;
        padding-top: 15px;
      }
      .run-layout {
        display: grid;
        grid-template-columns: minmax(520px, 1.25fr) minmax(280px, 0.75fr);
        gap: 18px;
        align-items: start;
      }
      .run-panel {
        padding: 22px;
      }
      .run-panel h2 {
        font-family: Georgia, serif;
        font-weight: 500;
        font-size: 22px;
        margin: 0;
        color: #203a31;
      }
      .run-intro {
        font-size: 13px;
        line-height: 1.55;
        color: #738178;

      .dropzone {

        text-align: center;

      .dropzone strong {

        font-size: 11px;

      .dropzone input {
        position: absolute;
        width: 1px;
        height: 1px;

      .photo-list {
        display: grid;
        gap: 8px;
        margin-top: 13px;
      }
      .photo-item {
        display: grid;
        grid-template-columns: 45px minmax(0, 1fr) auto;
        align-items: center;
        gap: 11px;
        padding: 8px 10px;
        border: 1px solid #e6ebe6;
        border-radius: 9px;
        background: #fff;
      }
      .photo-item img {
        width: 45px;
        height: 52px;

        border-radius: 5px;
        background: #f1eee7;

      .photo-name {

        font-weight: 700;

      .photo-size {

      .photo-remove {
        border: 0;

        color: #819087;
        font-size: 18px;
        cursor: pointer;
        padding: 4px 8px;
      }
      .field select {
        min-height: 39px;
      }
      .run-side {
        display: grid;
        gap: 12px;
      }
      .run-estimate {

      .run-estimate label {

        margin-top: 13px;

        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 17px;

      .run-form-actions .btn {
        min-width: 180px;
      }

        font-size: 12px;
        color: #587163;
        cursor: pointer;
        border: 0;
        background: transparent;
      }

        color: #78867d;
        margin-top: 12px;
      }
      .provider-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
        border-radius: 20px;

        font-size: 11px;
        font-weight: 750;
      }
      .provider-status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4d956f;

        color: #9b4b42;

        margin-top: 8px;
      }
      :is(button, a, select, [tabindex="0"]):focus-visible {

  <body>
    <div id="app"><div class="loading">Loading review workspace…</div></div>
    <script src="/cloudflare-dashboard-fixtures.js"></script>
    <script>
      const $ = s => document.querySelector(s),
        esc = s =>
          String(s ?? "").replace(
            /[&<>"']/g,
            c =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c]
          );
      const story = new URLSearchParams(location.search).get("story");
      const fixture = window.STORY_FIXTURES || {};
      const storyImage = id => story && fixture[story]?.images?.[id];
      const artifactUrl = id =>
        storyImage(id) || `/api/artifacts/${encodeURIComponent(id)}`;
      let state = {
        screen: story ? "story" : "books",
        selectedBook: null,
        selectedRun: null,
        selectedPage: null,
        selectedCandidate: null,
        data: null,
        books: [],
        runs: [],
        toast: "",
        modal: null,
        draftFiles: [],
        draft: null,
        pipelineConfig: {
          initialCandidateCount: 2,
          repairCandidateCount: 2,
          maxRepairRounds: 2,
          maxCandidatesPerPage: 6,
          maxCostPerPageMicros: 450000,
        },
      };
      const api = async (path, options = {}) => {
        const headers = options.body
          ? {
              "content-type": "application/json",
              "idempotency-key": options.idempotencyKey || crypto.randomUUID(),
            }
          : {};
        const r = await fetch("/api" + path, {
          method: options.method || "GET",
          headers,
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Request failed");
        return j;
      };
      function actionKey(action) {
        const key = `pictobook-action:${state.selectedBook}:${state.selectedPage}:${action}`;
        let value = sessionStorage.getItem(key);
        if (!value) {
          value = `ui:${crypto.randomUUID()}`;
          sessionStorage.setItem(key, value);
        }
        return { key, value };
      }
      function clearActionKey(action) {
        sessionStorage.removeItem(actionKey(action).key);
      }
      const id = v => v?.book_id || v?.bookId;
      const fmt = v =>
        v
          ? new Date(v).toLocaleDateString(undefined, {
              month: "short",
              day: "numeric",
              year: "numeric",
            })
          : "—";
      function badge(text, kind = "gray") {
        if (
          String(text).toLowerCase().includes("needs_review") ||
          String(text).toLowerCase().includes("needs review")
        )
          kind = "amber";
        return `<span class="pill ${kind}"><i class="dot"></i>${esc(text)}</span>`;
      }
      function statusKind(s) {
        return (
          {
            completed: "green",
            approved: "green",
            review: "amber",
            running: "blue",
            processing: "blue",
            partially_completed: "amber",
            needs_human_review: "amber",
            failed: "red",
            rejected: "red",
            created: "gray",
          }[s] || "gray"
        );
      }
      function shell(content, crumb = "Workspace") {

        const approved = p.state === "approved";
        $("#app").innerHTML = shell(
          `<button class="back" onclick="renderRun()">← Back to pages</button><div class="detail-title"><div><div class="eyebrow">Page ${String(photo?.ordinal || 1).padStart(2, "0")} · Candidate review</div><h1>${esc(state.selectedRun)}</h1><div class="sub">${badge(pageStatus(p), pageKind(p))} &nbsp; ${esc(p.terminal_reason || "Review candidates and QA findings")}</div></div><button class="btn line" onclick="openRun('${esc(state.selectedRun)}')">↻ &nbsp; Refresh</button></div>${approved ? `<div class="banner" style="background:#e6f2e9;color:#37624d">This page is approved. Its approved candidate is selected and shown first.</div>` : ""}<div class="review-grid"><section class="panel preview-panel"><div class="preview-head"><strong style="font-size:14px">Candidate ${String(c?.ordinal || 1).padStart(3, "0")}</strong>${p.approved_candidate_id === c?.candidate_id ? badge("Approved candidate", "green") : badge(c?.generation_kind === "repair" ? "Repaired candidate" : "Initial candidate", c?.generation_kind === "repair" ? "blue" : "gray")}</div><img class="preview-image" src="${url || placeholder(1)}" onerror="this.src='${placeholder(1)}'"><div style="margin-top:16px;font-weight:730;font-size:13px">Candidates <span class="muted" style="font-weight:500">(${cs.length})</span></div>${cs
            .map(x => {
              const q1 = qaFor(x, "print"),
                q2 = qaFor(x, "style"),
                round = (state.data.repairRounds || []).find(
                  r => r.repair_round_id === x.repair_round_id
                );
              return `<div class="candidate-row"><img class="candidate-thumb" src="${arts.find(a => a.artifact_id === x.clean_artifact_id)?.artifact_id ? artifactUrl(x.clean_artifact_id) : placeholder(x.ordinal)}"><div style="flex:1"><div class="candidate-title">${p.approved_candidate_id === x.candidate_id ? "✓ " : ""}Candidate ${String(x.ordinal).padStart(3, "0")} · ${x.generation_kind === "repair" ? `Repair round ${round?.round_number || "—"}` : "Initial generation"}</div><div class="candidate-details">${q1?.status === "passed" ? "Print passed" : "Print " + (q1?.status || "pending")} · Style ${q2?.status || "pending"}</div></div><button class="btn ${x.candidate_id === state.selectedCandidate ? "soft" : "line"}" onclick="chooseCandidate('${esc(x.candidate_id)}')">${x.candidate_id === state.selectedCandidate ? "Selected" : "View"}</button></div>`;
            })
            .join(
              ""
            )}</section><section><div class="panel" style="padding:19px"><div class="eyebrow">Quality review</div><h2 style="font-family:Georgia,serif;font-weight:500;font-size:24px;margin:7px 0 15px">QA results</h2>${[
            "print",
            "style",
          ]
            .map(k => {
              const q = qaFor(c || {}, k);
              return `<div class="qa-box"><div class="qa-title"><span>${k === "print" ? "Print QA" : "Style QA"}</span>${badge(q?.status || "Pending", q?.status === "passed" ? "green" : q?.status === "failed" ? "red" : "amber")}</div><div class="qa-copy">${k === "print" ? "Checks page size, grayscale output, printable area, and image integrity." : "Checks line weight, facial vocabulary, detail density, proportions, background restraint, and coloring-area size."}${q?.overall_score != null ? `<br><b>Score ${Number(q.overall_score).toFixed(2)}</b>` : ""}</div></div>`;
            })
            .join(
              ""
            )}</div>${last ? `<div class="banner">Latest review: ${esc(last.decision)}${last.notes ? ` — ${esc(last.notes)}` : ""}</div>` : ""}<div class="panel review-form"><h3>Reviewer action</h3><div class="field"><label for="notes">Notes for this candidate</label><textarea id="notes" placeholder="Add context for this review or future repair…">${esc(last?.notes || "")}</textarea></div><div class="form-actions"><button class="btn primary" onclick="submitReview('approved')" ${approved ? "disabled" : ""}>${approved ? "Already approved" : "Approve candidate"}</button><button class="btn line" onclick="submitReview('rejected')" ${approved ? "disabled" : ""}>Reject page</button><button class="btn soft" onclick="regenerate()">Regenerate from source</button></div>${last?.review_id ? `<div class="candidate-details" style="margin-top:12px">Review ${esc(last.review_id)} · ${esc(last.decision)}</div>` : ""}</div><div class="panel review-form" style="margin-top:12px"><h3>Canonical reference</h3><div class="candidate-details">Promote this human approved candidate into the active style pack.</div><button class="btn line" style="margin-top:12px" onclick="promote()" ${approved ? "" : "disabled"}>Add to canonical references</button></div></section></div>`,
          "Books / Run / Page"
        );
      }
      function openPage(pageId) {
        state.selectedPage = pageId;
        const p = state.data.pages.find(x => x.page_id === pageId);
        const cs = state.data.candidates
          .filter(c => c.page_id === pageId)
          .sort((a, b) =>
            a.candidate_id === p.approved_candidate_id
              ? -1
              : b.candidate_id === p.approved_candidate_id
                ? 1
                : a.ordinal - b.ordinal
          );
        state.selectedCandidate = (
          cs.find(c => c.candidate_id === p.approved_candidate_id) || cs[0]
        )?.candidate_id;
        renderPage(cs);
      }
      function chooseCandidate(id) {
        state.selectedCandidate = id;
        renderPage(
          state.data.candidates
            .filter(c => c.page_id === state.selectedPage)
            .sort((a, b) =>
              a.candidate_id ===
              state.data.pages.find(p => p.page_id === state.selectedPage)
                .approved_candidate_id
                ? -1
                : b.candidate_id ===
                    state.data.pages.find(p => p.page_id === state.selectedPage)
                      .approved_candidate_id
                  ? 1
                  : a.ordinal - b.ordinal
            )
        );
      }
      function submitReview(decision) {
        showModal(
          decision === "approved"
            ? "Approve this candidate?"
            : "Reject this page?",
          decision === "approved"
            ? "This exact candidate will be recorded as the human approved result."
            : "This page will be marked rejected for this review.",
          () => sendReview(decision)
        );
      }
      async function sendReview(decision) {
        const action = `review:${state.selectedCandidate}:${decision}`,
          requestKey = actionKey(action).value,
          buttons = [...document.querySelectorAll(".form-actions button")];
        buttons.forEach(button => (button.disabled = true));
        try {
          await api(
            `/books/${encodeURIComponent(state.selectedBook)}/pages/${encodeURIComponent(state.selectedPage)}/reviews`,
            {
              method: "POST",
              idempotencyKey: requestKey,
              body: {
                candidateId: state.selectedCandidate,
                decision,
                notes: $("#notes").value,
              },
            }
          );
          clearActionKey(action);
          toast(
            decision === "approved" ? "Candidate approved." : "Page rejected."
          );
          await openRun(state.selectedRun);
          openPage(state.selectedPage);
        } catch (e) {
          toast(e.message);
          buttons.forEach(button => (button.disabled = false));
        }
      }
      function regenerate() {
        showModal(
          "Regenerate from source?",
          "Starts a fresh run from the original photo. The preview API records the source page, but judge findings and reviewer notes are not yet added to the image request.",
          async () => {
            const action = "regenerate",
              requestKey = actionKey(action).value;
            try {
              const result = await api(
                `/books/${encodeURIComponent(state.selectedBook)}/pages/${encodeURIComponent(state.selectedPage)}/regenerations`,
                { method: "POST", idempotencyKey: requestKey, body: {} }
              );
              clearActionKey(action);
              toast("Regeneration started · " + result.runId);
              await openRun(state.selectedRun);
            } catch (e) {
              toast(e.message);
            }
          }
        );
      }
      function promote() {
        showModal(
          "Add to canonical references?",
          "This approved candidate will become a style reference for " +
            state.data.run.style_pack_version +
            ".",
          async () => {
            const stylePackVersion = state.data.run.style_pack_version,
              action = `canonical:${state.selectedCandidate}:${stylePackVersion}`,
              requestKey = actionKey(action).value;
            try {
              const review = (state.data.reviews || []).find(
                x =>
                  x.candidate_id === state.selectedCandidate &&
                  x.decision === "approved"
              );
              if (!review)
                throw new Error("Approve this candidate before promoting it.");
              await api(
                `/books/${encodeURIComponent(state.selectedBook)}/candidates/${encodeURIComponent(state.selectedCandidate)}/canonical-promotions`,
                {
                  method: "POST",
                  idempotencyKey: requestKey,
                  body: { reviewId: review.review_id, stylePackVersion },
                }
              );
              clearActionKey(action);
              toast("Canonical reference added.");
              await openRun(state.selectedRun);
              openPage(state.selectedPage);
            } catch (e) {
              toast(e.message);
            }
          }
        );
      }
      function showModal(title, copy, action) {
        state.modal = action;
        const d = document.createElement("div");
        d.className = "modal-backdrop";
        d.id = "modal";
        d.innerHTML = `<div class="modal"><h2>${esc(title)}</h2><p>${esc(copy)}</p><div class="modal-actions"><button class="btn line" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmModal()">Confirm</button></div></div>`;
        document.body.appendChild(d);
      }
      function closeModal() {
        $("#modal")?.remove();
        state.modal = null;
      }
      async function confirmModal() {
        const f = state.modal;
        closeModal();
        if (f) await f();
      }
      function toast(s) {
        const t = document.createElement("div");
        t.className = "toast";
        t.textContent = s;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3500);
      }
      function showError(s) {
        $("#app").innerHTML = shell(
          `<div class="panel error"><strong>Could not load run data</strong><p>${esc(s)}</p><button class="btn line" onclick="refreshBooks()">Try again</button></div>`
        );
      }
      function goBooks() {
        state.selectedBook = null;
        state.selectedRun = null;
        state.screen = "books";
        refreshBooks();
      }
      const renderPageBase = renderPage;
      renderPage = function (cs) {
        renderPageBase(cs);
        const page = state.data.pages.find(
            x => x.page_id === state.selectedPage
          ),
          photo = (state.data.photos || []).find(
            x => x.photo_id === page.photo_id
          ),
          candidate = cs.find(x => x.candidate_id === state.selectedCandidate),
          arts = state.data.artifacts || [],
          brief = arts.find(
            a => a.page_id === page.page_id && a.artifact_kind === "page_brief"
          ),
          round = (state.data.repairRounds || []).find(
            x => x.repair_round_id === candidate?.repair_round_id
          );
        const panel = document.querySelector(".preview-panel"),
          image = panel?.querySelector(".preview-image");
        if (!panel || !image) return;
        const strip = document.createElement("div");
        strip.className = "source-strip";
        strip.innerHTML = `<img src="${photo?.source_artifact_id ? artifactUrl(photo.source_artifact_id) : placeholder(photo?.ordinal)}" onerror="this.src='${placeholder(photo?.ordinal)}'"><div><strong>Source photo ${String(photo?.ordinal || 1).padStart(2, "0")}</strong><small>${candidate?.generation_kind === "repair" ? `Repair round ${round?.round_number || page.repair_round_count} · generated from original source` : "Original customer source · private artifact"}</small></div>${brief ? `<button onclick="toggleBrief('${esc(brief.artifact_id)}')">View brief</button>` : ""}`;
        panel.insertBefore(strip, image);
        if (brief) {
          const box = document.createElement("pre");
          box.id = "brief-box";
          box.className = "brief-box";
          panel.insertBefore(box, image);
        }
        if (page.state === "approved") {
          const actions = document.querySelectorAll(".form-actions .btn");
          if (actions[0]) {
            actions[0].disabled = true;
            actions[0].textContent = "Already approved";
          }
          if (actions[1]) actions[1].disabled = true;
          const banner = document.querySelector(".banner");
          if (banner)
            banner.textContent = `This page was ${page.approval_source === "human" ? "approved by a reviewer" : "approved automatically"}. Its approved candidate is selected and shown first.`;
        }
      };
      async function toggleBrief(artifactId) {
        const box = $("#brief-box");
        if (!box) return;
        if (box.style.display === "block") {
          box.style.display = "none";
          return;
        }
        box.style.display = "block";
        if (box.textContent) return;
        try {
          if (story && fixture[story]?.briefs?.[artifactId]) {
            box.textContent = fixture[story].briefs[artifactId];
            return;
          }
          const response = await fetch(artifactUrl(artifactId));
          box.textContent = await response.text();
        } catch {
          box.textContent = "Could not load the page brief.";
        }
      }
      function placeholder(i) {
        const hues = ["#d9b291", "#a6b9a6", "#d6c17e", "#c9a8a0"];
        const fill = hues[(Number(i) || 1) % hues.length];
        return (
          "data:image/svg+xml," +
          encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="250" height="320" viewBox="0 0 250 320"><rect width="250" height="320" rx="12" fill="#f5f1e9"/><circle cx="126" cy="118" r="57" fill="${fill}"/><path d="M53 283c7-73 39-108 73-108s66 35 73 108" fill="none" stroke="#31483b" stroke-width="5" stroke-linecap="round"/><circle cx="106" cy="116" r="3"/><circle cx="146" cy="116" r="3"/><path d="M112 139q14 12 28 0" fill="none" stroke="#31483b" stroke-width="3" stroke-linecap="round"/><text x="125" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#718078">SYNTHETIC PREVIEW</text></svg>`
          )
        );
      }
      const renderNewRunBase = renderNewRun;
      renderNewRun = function () {
        MAX_PAGE_BUDGET_MICROS = maxPageBudgetMicros();
        renderNewRunBase();
        const config = state.pipelineConfig,
          rows = document.querySelector(".run-config"),
          estimate = document.querySelector(".run-estimate small");
        if (rows) {
          rows.insertAdjacentHTML(
            "beforeend",
            `<div class="config-row"><span>Initial candidates per page</span><strong>${config.initialCandidateCount}</strong></div><div class="config-row"><span>Automatic repair</span><strong>${config.maxRepairRounds} rounds · ${config.repairCandidateCount} each</strong></div>`
          );
        }
        if (estimate)
          estimate.textContent = `Up to $${money(maxPageBudgetMicros())} per page, including ${config.maxCandidatesPerPage} candidates and the same number of Style QA calls. Actual provider charges may be lower.`;
        updateRunPhotoList();
      };
      const updateRunPhotoListBase = updateRunPhotoList;
      updateRunPhotoList = function () {
        updateRunPhotoListBase();
        const cost = $("#run-cost-total");
        if (cost)
          cost.textContent = `$${money(state.draftFiles.length * maxPageBudgetMicros())}`;
      };
      async function init() {
        if (story === "loading") return;
        if (story === "error") {
          showError(
            "The preview API could not be reached. Check the local API URL and reviewer token, then retry."
          );
          return;
        }
        if (story === "new-run") {
          state.books = fixture.books?.books || [];
          renderNewRun();
          return;
        }
        if (story) {
          const f = fixture[story];
          if (f) {
            state.data = f.data;
            state.selectedBook = f.bookId;
            state.selectedRun = f.runId;
            state.books = f.books || [];
            state.runs = f.runs || [];
            state.selectedPage = f.pageId;
            state.selectedCandidate = f.candidateId;
            if (story === "books" || story === "books-empty")
              renderBooks(f.books || []);
            else if (story === "book-runs" || story === "book-runs-empty")
              renderBook(f.books?.[0] || {});
            else if (story === "run" || story === "canonical-added")
              renderRun();
            else if (
              [
                "page",
                "brief",
                "approved",
                "human-approved",
                "review-confirm",
                "regeneration",
                "canonical",
              ].includes(story)
            )
              renderPage(f.data.candidates.filter(c => c.page_id === f.pageId));
            if (story === "brief") toggleBrief("brief2");
            if (story === "review-confirm")
              showModal(
                "Approve this candidate?",
                "This exact candidate will be recorded as the human approved result.",
                () => {}
              );
            if (story === "regeneration")
              showModal(
                "Regeneration queued",
                "A fresh run will use the original source photo. QA findings and reviewer notes are not yet added to the image request.",
                () => {}
              );
            if (story === "canonical")
              showModal(
                "Add to canonical references?",
                "This approved candidate will become a style reference for pictobook-preschool-v0.1.",
                () => {}
              );
            return;
          }
        }
        refreshBooks();
      }
      init();
    </script>
  </body>
</html>
