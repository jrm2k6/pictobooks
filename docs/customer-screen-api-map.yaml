version: 1
contractStatus: target
description: >-
  Agent-readable map from the React story states to API operations and the
  planned TanStack Query integration boundary. `reactStatus` remains
  disconnected until the customer app is wired to real endpoints.
sources:
  openapi: docs/customer-api.openapi.yaml
  screenCatalog: apps/web/screenCatalog.js
  stateMachine: apps/web/stateMachine.js
  routeAndComponentRegistry: apps/web/app.jsx
  apiClient: apps/web/api-client.js
  queryHooks: apps/web/hooks/
operationStatus:
  listBooks:
    worker: partial
    reactClient: connected
    hook: useBooks (apps/web/hooks/use-books.js)
    details: Exists, but the response does not yet include target latest-run/page and order summaries.
  createBook:
    worker: partial
    reactClient: connected
    hook: useCreateBook (apps/web/hooks/use-create-book.js)
    details: Exists, but currently ignores the book title and child personalization fields.
  updateBook:
    worker: planned
    reactClient: disconnected
  listBookRuns:
    worker: implemented
    reactClient: connected
    hook: useBookPages (apps/web/hooks/use-book-pages.js)
    details: Review and preview request live lineage to discover current regeneration and photo replacement runs across the book's history.
  createBookRun:
    worker: implemented
    reactClient: connected
    hook: useCreateBookRun (apps/web/hooks/use-create-book-run.js)
    details: Creates the run and upload intents. Local mode returns authenticated Worker upload URLs backed by local R2; PhotoSelectionPage performs the direct PUT uploads.
  startBookRun:
    worker: implemented
    reactClient: connected
    details: Called from OrderPagesPage after updatePhotoOrder succeeds.
  getBookRun:
    worker: partial
    reactClient: connected
    hook: useBookRun (apps/web/hooks/use-book-run.js)
    details: Exists, but response serialization needs to match the camelCase nested target schema. Polled every 2 s while run is active.
  refreshUploadIntent:
    worker: implemented
    reactClient: disconnected
    details: Local-only authenticated Worker URL refresh; preview/prod remain on the separate R2 presigner path.
  updatePhotoOrder:
    worker: implemented
    reactClient: connected
    details: Called from OrderPagesPage before startBookRun; idempotency is handled by the API layer.
  reviewCandidate:
    worker: implemented
    reactClient: connected
    hook: usePageReview (apps/web/hooks/use-page-review.js)
  setPageInclusion:
    worker: implemented
    reactClient: connected
    hook: usePageReview (apps/web/hooks/use-page-review.js)
    details: Removes or restores an original page slot. Removed slots are omitted from preview, PDF, and approval gating.
  regeneratePage:
    worker: implemented
    reactClient: connected
    hook: usePageReview (apps/web/hooks/use-page-review.js)
  createPhotoReplacement:
    worker: implemented
    reactClient: connected
    hook: usePageReview (apps/web/hooks/use-page-review.js)
    details: Returns an upload intent for the new photo; the existing uploadPhoto + startBookRun sequence completes it.
  getArtifactAccess:
    worker: implemented
    reactClient: connected
    hook: useArtifactAccess (apps/web/hooks/use-artifact-access.js)
  downloadPrintablePdf:
    worker: implemented
    reactClient: connected
    details: The alpha-enabled primary run exports its current explicitly approved candidates in preview order using an authenticated PDF response.
  listEditions:
    worker: implemented
    reactClient: disconnected
    details: Local prototype catalog only; entries are unavailable and have zero illustrative prices.
  createOrder:
    worker: planned
    reactClient: disconnected
  getOrder:
    worker: planned
    reactClient: disconnected
integrationRules:
  networkOwner: Route-level integration hooks; do not issue fetch calls from presentational screen components.
  screenBoundary: Existing screen components receive data and callbacks as props; keep that contract while connecting API operations.
  queryLibrary: TanStack Query
  mutationHeaders:
    - Authorization: Bearer Clerk session token
    - Idempotency-Key: fresh stable key per user intent; reuse for retries of that same intent
  queryKeys:
    books: [books]
    bookRuns: [book-runs, bookId]
    bookRun: [book-run, bookId, runId]
    editions: [editions]
    order: [order, orderId]
  invalidateAfterMutation:
    createBook: [[books]]
    updateBook: [[books], [book, bookId]]
    createBookRun: [[books], [book-runs, bookId], [book-run, bookId, runId]]
    updatePhotoOrder: [[book-run, bookId, runId]]
    startBookRun: [[books], [book-run, bookId, runId]]
    reviewCandidate: [[books], [book-run, bookId, runId]]
    regeneratePage: [[books], [book-runs, bookId], [book-run, bookId, runId]]
    createOrder: [[books], [order, orderId]]

screens:
  - id: library
    title: My books
    route: /books
    component: apps/web/books-page.jsx
    reactStatus: connected
    reads:
      - operationId: listBooks
        hook: useBooksQuery
        when: On route entry and after book/order mutations.
      - operationId: getBookRun
        hook: useBookRunQuery
        when: When opening a book with ready pages or resuming an in-progress book.
    actions:
      - event: Create book
        operationId: createBook
        mutationHook: useCreateBookMutation
        nextScreen: create
      - event: Review ready pages
        operationId: getBookRun
        nextScreen: review
      - event: Open an earlier book
        operationId: getBookRun
        nextScreen: preview
      - event: View order status
        operationId: getOrder
        nextScreen: complete

  - id: empty
    title: First visit
    route: /books
    component: apps/web/books-page.jsx
    note: EmptyState is rendered inline in BooksPage when useBooks() returns an empty array.
    reactStatus: connected
    reads: []
    actions:
      - event: Start a book
        operationId: createBook
        mutationHook: useCreateBookMutation
        nextScreen: create
      - event: See how it works
        operationId: none
        note: Static explanatory content; photo upload starts only after book details are saved.
        nextScreen: upload

  - id: account
    title: Sign in or create an account
    route: /account/sign-in
    component: apps/web/screens/SignInScreen.jsx
    reactStatus: disconnected
    authProvider: Clerk React SDK
    reads: []
    actions:
      - event: Continue with Google
        operationId: none
        note: Clerk handles OAuth and session creation.
      - event: Continue with email link
        operationId: none
        note: Clerk sends and verifies the magic link; Pictobook does not handle credentials.

  - id: account-sent
    title: Check your email
    route: /account/check-email
    component: apps/web/screens/EmailConfirmationScreen.jsx
    reactStatus: disconnected
    authProvider: Clerk React SDK
    reads: []
    actions:
      - event: Edit address
        operationId: none
        nextScreen: account
      - event: Sign-in link opened
        operationId: listBooks
        note: After Clerk completes sign-in, the library fetches the signed-in user's books.
        nextScreen: library

  - id: create
    title: Book details
    route: /books/new/details
    component: apps/web/pages/book-details-page.jsx
    reactStatus: connected
    reads: []
    actions:
      - event: Save new book details
        operationId: createBook
        mutationHook: useCreateBookMutation
        nextScreen: upload
      - event: Save existing book edits
        operationId: updateBook
        mutationHook: useUpdateBookMutation
        nextScreen: upload

  - id: upload
    title: Choose photos
    route: /books/new/photos
    component: apps/web/pages/photo-selection-page.jsx
    reactStatus: connected
    reads: []
    actions:
      - event: Continue with selected photos
        operationId: createBookRun
        mutationHook: useCreateBookRunMutation
        sideEffect: PUT each local file to its returned uploadUrl with requiredHeaders, directly to R2.
        stateMachineEvent: Arrange pages
        nextScreen: arrange

  - id: arrange
    title: Order the pages
    route: /books/new/order
    component: apps/web/pages/order-pages-page.jsx
    reactStatus: connected
    reads:
      - operationId: getBookRun
        hook: useBookRunQuery
        when: Load saved photo upload state when resuming an unstarted run.
    actions:
      - event: Reorder photos
        operationId: updatePhotoOrder
        mutationHook: useUpdatePhotoOrderMutation
        when: Persist the selected order before starting generation.
      - event: Make the pages
        operationId: startBookRun
        mutationHook: useStartBookRunMutation
        precondition: Every upload succeeded and the final order is saved.
        stateMachineEvent: Make the pages
        nextScreen: processing

  - id: processing
    title: Pages are being made
    route: /books/new/creating
    component: apps/web/pages/processing-page.jsx
    reactStatus: connected
    reads:
      - operationId: getBookRun
        hook: useBookRunQuery
        refetchInterval: Poll while run status is created, running, or partially_completed; stop on terminal status.
    actions:
      - event: Pages ready
        operationId: getBookRun
        nextScreen: review

  - id: slow
    title: Some pages are taking longer
    route: /books/new/creating/slow
    component: apps/web/screens/SlowProcessingScreen.jsx
    reactStatus: disconnected
    reads:
      - operationId: getBookRun
        hook: useBookRunQuery
        refetchInterval: Continue polling unfinished pages while run is active.
    actions:
      - event: Review finished pages
        operationId: getBookRun
        nextScreen: review
      - event: Page needs a retry
        operationId: getBookRun
        note: Read the page state first; the customer chooses retry from the review screen.
        nextScreen: review

  - id: review
    title: Review your pages
    route: /books/new/pages
    component: apps/web/pages/page-review-page.jsx
    reactStatus: connected
    reads:
      - operationId: getBookRun
        hook: usePageReview (via useBookPages)
        when: Load the primary run's pages, and poll each in-flight regeneration/replacement run while it's still generating.
      - operationId: listBookRuns
        hook: usePageReview (via useBookPages)
        when: On route entry and after every mutation, to discover regeneration/photo-replacement runs and resolve each page slot's current pointer — including surviving a reload mid-review.
      - operationId: getArtifactAccess
        hook: useArtifactAccess
        when: Request a short-lived, authenticated image URL for each grid thumbnail and for the open detail view's candidate/source images.
    actions:
      - event: Keep page
        operationId: reviewCandidate
        mutationHook: usePageReview().keepPage
        decision: approved
        when: Page state is approved (auto-passed QA) or needs_human_review ("Use this page anyway").
      - event: Remove from book / Keep this page
        operationId: setPageInclusion
        mutationHook: usePageReview().setPageInclusion
        note: Changes the original slot's inclusion and preserves its candidates and approval history. Keeping a page also confirms its candidate when approval is still needed.
      - event: Try another version / Try again
        operationId: regeneratePage
        mutationHook: usePageReview().tryAgain
        note: For a needs_human_review page, reviewCandidate(rejected) is called first so the reject decision is never left unresolved; for an approved, already-rejected, provider_failed, or budget_exhausted page, regeneratePage is called directly. Disabled (replaced by a contact-support link) once the book's 3-regeneration cap is reached.
      - event: Upload a different photo
        operationId: createPhotoReplacement
        mutationHook: usePageReview().replacePhoto
        note: Shown only for intake_rejected/intake_needs_review pages (the source photo itself was unusable, so there is no candidate to keep). Followed by the existing uploadPhoto + startBookRun sequence. Disabled (replaced by a contact-support link) once the book's separate 3-replacement cap is reached.
      - event: Continue
        operationId: getBookRun
        note: Enabled when at least one slot is included and every included slot has explicit human approval.
        nextScreen: preview

  - id: preview
    title: Preview the book
    route: /books/new/preview
    component: apps/web/pages/book-preview-page.jsx
    reactStatus: connected
    reads:
      - operationId: getBookRun
        hook: useBookPages
        when: Load the primary run's pages, resolved to each slot's current page, the same reconciliation the review screen uses.
      - operationId: listBookRuns
        hook: useBookPages
        when: Discover regeneration/photo-replacement runs and resolve each page slot's current pointer.
      - operationId: getArtifactAccess
        hook: useArtifactAccess
        when: Request a short-lived, authenticated image URL for each spread page's approved candidate.
    actions:
      - event: Download printable PDF
        operationId: downloadPrintablePdf
        note: Available when the primary run enables alpha downloads and every current page is explicitly approved.
      - event: Choose an edition
        operationId: none
        note: The button remains a placeholder in environments with alpha downloading disabled.
        nextScreen: edition
      - event: Back to page review
        operationId: getBookRun
        nextScreen: review

  - id: edition
    title: Choose an edition
    route: /books/new/edition
    component: apps/web/screens/EditionSelectionScreen.jsx
    reactStatus: disconnected
    reads:
      - operationId: listEditions
        hook: useEditionsQuery
        when: Load current edition availability, price, and shipping price.
    actions:
      - event: Continue to delivery
        operationId: none
        note: Retain the selected edition in local checkout flow state until order creation.
        nextScreen: checkout

  - id: checkout
    title: Delivery details
    route: /checkout
    component: apps/web/screens/CheckoutScreen.jsx
    reactStatus: disconnected
    reads:
      - operationId: listEditions
        hook: useEditionsQuery
        when: Resolve authoritative price and delivery terms for the selected edition.
    actions:
      - event: Place order
        operationId: createOrder
        mutationHook: useCreateOrderMutation
        nextScreen: complete
        note: Navigate to the hosted payment URL; order is not paid until verified provider webhook confirms it.

  - id: complete
    title: Order received
    route: /order/received
    component: apps/web/screens/OrderCompleteScreen.jsx
    reactStatus: disconnected
    reads:
      - operationId: getOrder
        hook: useOrderQuery
        when: Load payment and fulfillment status.
      - operationId: getArtifactAccess
        hook: useArtifactAccessQuery
        when: Request temporary access to a paid digital PDF.
    actions:
      - event: Download PDF
        operationId: getArtifactAccess
        nextScreen: preview
      - event: Return to My books
        operationId: listBooks
        nextScreen: library

  - id: upload-error
    title: Photo upload failed
    route: /books/new/photos/error
    component: apps/web/screens/PhotoUploadErrorScreen.jsx
    reactStatus: disconnected
    reads:
      - operationId: getBookRun
        hook: useBookRunQuery
        when: Identify the failed photo upload intent.
    actions:
      - event: Try another photo
        operationId: refreshUploadIntent
        mutationHook: useRefreshUploadIntentMutation
        sideEffect: Repeat the direct R2 PUT using the refreshed URL and headers.
        nextScreen: upload
      - event: Leave creation
        operationId: none
        nextScreen: library

  - id: generation-error
    title: A page could not be made
    route: /books/new/pages/error
    component: apps/web/screens/GenerationErrorScreen.jsx
    reactStatus: disconnected
    reads:
      - operationId: getBookRun
        hook: useBookRunQuery
    actions:
      - event: Retry page
        operationId: none
        note: This moves to the review screen; the retry mutation is started from that screen.
        nextScreen: review
      - event: Return to book
        operationId: listBooks
        nextScreen: library

flows:
  source: apps/web/stateMachine.js
  note: OpenAPI x-customer-journeys carries the journey summary visible in Swagger UI; this file adds screen/component ownership and planned React Query hook names.
  crossReferences:
    - account
    - create-book
    - review-and-repair
    - purchase
    - recovery
